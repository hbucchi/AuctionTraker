<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>AuctionTraker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky filter rail + scannable lot rows; a second tab holds the user's saved strategies.
   Always light (ivory, warm ink, bronze accents), whatever the visitor's system theme. */
:root {
  color-scheme: light;
  --bg: #f6f2ea;          /* ivory page */
  --surface: #fffdf8;     /* cards */
  --surface-2: #faf6ee;   /* inputs, quiet panels */
  --ink: #1d1b18;         /* warm near-black */
  --muted: #74695c;
  --line: #e8e1d4;
  --accent: #86662b;      /* bronze: links, bands, selected states */
  --accent-soft: #f2e9d7;
  --gold: #b8964f;        /* hairlines and hover only, never text */
  --good: #2d6a4b;
  --good-soft: #e5efe6;
  --warn: #8f611d;
  --warn-soft: #f7eedc;
  --bad: #9a3b31;
  --bad-soft: #f7e6e2;
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --shadow: 0 1px 2px rgb(70 52 20 / .04), 0 10px 28px -16px rgb(70 52 20 / .18);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner, .page, .single {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { display: flex; align-items: center; gap: 8px 24px; padding-block: 14px; flex-wrap: wrap; }
.wordmark { font: 600 25px/1 var(--font-display); letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
.wordmark svg { color: var(--gold); }
.freshness { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; }
.tab {
  border: 0; border-bottom: 1.5px solid transparent; background: none; padding: 8px 2px; margin: 0 8px; cursor: pointer;
  font-weight: 500; color: var(--muted); letter-spacing: .01em; display: inline-flex; gap: 6px; align-items: center;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab .count-badge { background: var(--ink); color: var(--surface); border-radius: 999px; font-size: 11px; padding: 1px 6px; }
.badge-preview {
  font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--gold); padding: 3px 10px; border-radius: 999px;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 16px; font-weight: 500; letter-spacing: .01em; text-decoration: none;
}
.btn:hover { border-color: var(--gold); }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn-primary:hover { background: #33302b; border-color: #33302b; }
.btn-danger { color: var(--bad); }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.user { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }

.page { padding-block: 28px 64px; display: grid; gap: 28px; grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
.single { padding-block: 28px 64px; display: grid; gap: 20px; }
@media (max-width: 900px) { .page { grid-template-columns: minmax(0, 1fr); } }

/* ---- filters ---- */
.filters {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  max-height: calc(100vh - 110px); overflow: auto;
}
@media (max-width: 900px) { .filters { position: static; max-height: none; } }
.filters summary {
  list-style: none; cursor: pointer; padding: 18px 18px 14px; font: 600 20px/1 var(--font-display);
  display: flex; justify-content: space-between; align-items: center;
}
.filters summary::-webkit-details-marker { display: none; }
.filters summary .count { font: 500 13px var(--font-body); color: var(--muted); }
.filter-body { display: grid; gap: 18px; padding: 0 18px 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .label, .label {
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; min-width: 0;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-toggle { position: relative; }
.chip-toggle input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip-toggle span {
  display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 13px;
}
.chip-toggle span small { color: var(--muted); font-size: 12px; }
.chip-toggle input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip-toggle input:checked + span small { color: color-mix(in srgb, var(--surface) 75%, transparent); }
.chip-toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; justify-self: start; }

/* ---- summary ---- */
.main { display: grid; gap: 16px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.stat .k { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 600 32px/1.1 var(--font-display); margin-top: 6px; font-variant-numeric: lining-nums tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; }

.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .result-count { font-weight: 600; }
.toolbar select { width: auto; }
.banner {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--gold); color: var(--ink); font-weight: 500;
}

/* ---- lot rows ---- */
.list { display: grid; gap: 14px; }
.lot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.lot-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 18px; align-items: start; padding: 16px; }
@media (max-width: 640px) { .lot-row { grid-template-columns: 64px minmax(0, 1fr); } .lot-row .price-col { grid-column: 1 / -1; text-align: left; justify-items: start; } }
.thumb {
  width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; overflow: hidden; font: 600 20px var(--font-display); letter-spacing: .04em; max-width: 100%;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lot-main { min-width: 0; display: grid; gap: 6px; }
.lot-title { font: 600 19px/1.25 var(--font-display); text-decoration: none; overflow-wrap: anywhere; }
.lot-title:hover { color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.tag.src { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 500; }
.tag.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
.tag.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.tag.new { color: var(--surface); background: var(--ink); border-color: transparent; font-weight: 600; }
.rounds { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.round b { font-weight: 600; }
.round.past { color: var(--muted); text-decoration: line-through; }
.price-col { display: grid; gap: 4px; justify-items: end; text-align: right; }
.price { font: 600 27px/1.05 var(--font-display); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.appraisal { font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.good { color: var(--good); background: var(--good-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.mute { color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); }
.dd-toggle { font-size: 12px; }

/* ---- due diligence ---- */
.dd { padding: 4px 0 0; display: grid; gap: 10px; }
.dd-item { display: grid; gap: 4px; }
.dd-item .check { font-size: 14px; }
.dd-help { color: var(--muted); font-size: 12px; margin-left: 26px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.dd-help a { color: var(--accent); }

/* ---- map ---- */
.map-wrap { display: grid; gap: 8px; }
.map { position: relative; height: max(440px, 68vh); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.map svg { width: 100%; height: 100%; display: block; }
.map svg .uf { fill: var(--bg); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.map svg .pin { stroke: var(--surface); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
.map svg .pin:hover, .map svg .pin.sel { stroke: var(--ink); stroke-width: 2; }
.map-pop {
  position: absolute; z-index: 3; width: min(300px, calc(100% - 24px)); background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgb(0 0 0 / .18); padding: 12px; display: grid; gap: 6px; font-size: 13px;
}
.map-pop .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.map-pop a.title { font-weight: 600; text-decoration: none; padding-right: 18px; }
.map-pop .go { justify-self: start; text-decoration: none; }
.gm-pop { display: grid; gap: 6px; font: 13px/1.4 var(--font-body); color: #1d1b18; max-width: 280px; }
.gm-pop a { color: #86662b; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

.st-nums b.pos { color: var(--good); }
.st-nums b.neg { color: var(--bad); }

/* ---- card expand + ficha ---- */
.lot-row { grid-template-columns: 112px minmax(0, 1fr) auto 28px; }
@media (max-width: 640px) { .lot-row { grid-template-columns: 72px minmax(0, 1fr) 28px; } .lot-row .price-col { grid-column: 1 / -1; grid-row: 2; } .lot-row .expand { grid-column: 3; grid-row: 1; } }
/* the expand control is a bare chevron: no box, just a quiet glyph that darkens on hover */
.expand { align-self: center; border: 0; background: none; padding: 0; width: 28px; height: 44px; cursor: pointer; color: var(--muted); opacity: .55; display: grid; place-items: center; border-radius: 6px; }
.expand:hover, .lot.open .expand { opacity: 1; color: var(--ink); }
.expand svg { transition: transform .2s ease; }
.lot.open .expand svg { transform: rotate(180deg); }
.bar-cap { font-size: 12px; color: var(--muted); white-space: nowrap; }
.ficha { border-top: 1px solid var(--line); padding: 20px 20px 24px; display: grid; gap: 24px; background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.fsec { display: grid; gap: 10px; }
.fsec + .fsec { border-top: 1px solid var(--line); padding-top: 20px; }
.fsec h3 { font: 600 21px/1.2 var(--font-display); margin: 0; }
.why-none { margin: 0; color: var(--muted); max-width: 72ch; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.estimate-note { margin: 0; font-size: 12px; color: var(--muted); background: transparent; border-left: 2px solid var(--gold); padding: 2px 0 2px 12px; }
.sim { display: grid; gap: 10px; }
.sim-ctl { display: grid; gap: 10px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.sim-ctl label { display: block; font-size: 13px; }
.sim-ctl input[type=range] { display: block; width: 100%; margin-top: 6px; accent-color: var(--accent); }
.vt td.why { white-space: normal; color: var(--muted); font-size: 12px; min-width: 160px; }
.vt tr.sum td { border-top: 2px solid var(--line); }
.rb-tgt { position: absolute; top: 0; height: 16px; border-left: 2px dashed var(--good); margin-left: -1px; }
.rbar.big .rb-tgt { height: 26px; }
.rbar.roe .rb-50 { background: color-mix(in srgb, var(--warn) 40%, transparent); }
.rbar.roe.good .rb-50 { background: color-mix(in srgb, var(--good) 40%, transparent); }
.rbar.roe.bad .rb-50 { background: color-mix(in srgb, var(--bad) 40%, transparent); }
.rbar.roe .rb-mid { background: var(--ink); }

/* ---- range bar ---- */
.rbar { position: relative; width: 190px; max-width: 100%; height: 16px; margin-top: 2px; }
.rbar.big { width: 100%; height: 44px; margin: 6px 0 2px; }
.rb-track { position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: var(--line); }
.rbar.big .rb-track { top: 10px; height: 6px; }
.rb-80 { position: absolute; top: 3px; height: 10px; border-radius: 5px; background: var(--accent-soft); }
.rb-50 { position: absolute; top: 3px; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 45%, transparent); }
.rbar.big .rb-80, .rbar.big .rb-50 { top: 4px; height: 18px; border-radius: 9px; }
.rb-mid { position: absolute; top: 1px; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); }
.rbar.big .rb-mid { top: 1px; height: 24px; }
.rb-be { position: absolute; top: 0; width: 2px; height: 16px; margin-left: -1px; background: var(--bad); }
.rbar.big .rb-be { height: 26px; }
.rb-bid { position: absolute; top: 9px; width: 0; height: 0; margin-left: -6px; border: 6px solid transparent; border-bottom: 8px solid var(--good); }
.rbar.big .rb-bid { top: 14px; }
.rb-lbl { position: absolute; top: 28px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.rb-lbl.bid { color: var(--good); font-weight: 600; top: 28px; }
.val-facts { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
details.how summary { cursor: pointer; color: var(--accent); font-size: 13px; }
details.how[open] { display: grid; gap: 8px; }

/* ---- valuation ---- */
.val { display: grid; gap: 12px; }
.val-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
.val-head b { font: 600 22px var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
.scale { position: relative; height: 54px; margin: 4px 8px 0; }
.scale .axis { position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: var(--line); }
.scale .band { position: absolute; top: 14px; height: 18px; background: var(--accent-soft); border-radius: 4px; }
.scale .mark { position: absolute; top: 10px; width: 2px; height: 26px; transform: translateX(-1px); }
.scale .mark.mid { background: var(--accent); }
.scale .mark.price { background: var(--good); }
.scale .mark.official { background: var(--warn); }
.scale .dot { position: absolute; top: 17px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); font-size: 0; }
.scale .tick { position: absolute; top: 38px; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.table-wrap { overflow-x: auto; }
.vt { border-collapse: collapse; width: 100%; font-size: 13px; }
.vt th, .vt td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.vt th { font-size: 12px; color: var(--muted); font-weight: 600; }
.vt td.num, .vt th.num { text-align: right; }
.vt td.name { white-space: normal; min-width: 200px; }
.vt tr.na td { color: var(--muted); }

.more { justify-self: center; }
.empty, .gate {
  background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 32px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center;
}
.gate h1 { font: 600 34px/1.15 var(--font-display); color: var(--ink); margin: 0; text-wrap: balance; }
.gate p { margin: 0; max-width: 52ch; }
.notice { font-size: 13px; color: var(--muted); }
.error { color: var(--bad); }

/* ---- strategies ---- */
.st-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.st-head h1 { font: 600 32px/1.15 var(--font-display); margin: 0; }
.st-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.st-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 10px; align-content: start; }
.st-card h2 { font: 600 22px/1.2 var(--font-display); margin: 0; overflow-wrap: anywhere; }
.st-nums { display: flex; gap: 16px; flex-wrap: wrap; }
.st-nums b { font: 600 28px/1 var(--font-display); display: block; font-variant-numeric: lining-nums tabular-nums; }
.st-nums span { color: var(--muted); font-size: 12px; }
.st-crit { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.st-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.editor { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: grid; }
.editor-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px; border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); background: var(--surface); z-index: 2; border-radius: var(--radius) var(--radius) 0 0; }
.editor-top .input { max-width: 420px; font-weight: 600; }
.live-count { font-weight: 600; color: var(--accent); }
.ed-group { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
.ed-group h3 { font: 600 20px var(--font-display); margin: 0; }
.ed-grid { display: grid; gap: 14px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.range { display: grid; gap: 6px; }
.range .minmax { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.range .unit { font-size: 12px; color: var(--muted); }
.help { font-size: 12px; color: var(--muted); }
.ed-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg label { padding: 6px 14px; cursor: pointer; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--surface); }
.seg input:checked + span { font-weight: 500; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (prefers-reduced-motion: no-preference) { .lot { transition: border-color .2s, box-shadow .2s; } .lot:hover { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); } }
</style>

<body>
<header class="topbar">
  <div class="topbar-inner">

<script src="firebase-config.js"></script>
<script type="module">
import { matchesStrategy, nextDeadline } from "./strategy.js";
import { roeRange, roeAssumptions, flip, chances, valueNeeded } from "./roe.js";

const FIREBASE_SDK = "13.4.0";
const PAGE = 40;
const SITES = {
  zuk: "Portal Zuk", biasi: "Biasi", frazao: "Frazão", superbid: "Superbid",
  picelli: "Picelli", alfa: "Alfa", pgfn: "PGFN Comprei",
};
const CATS = { imovel: "Imóveis", veiculo: "Veículos", outros: "Outros" };
const TZ = "America/Sao_Paulo";
const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const brlShort = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact", maximumFractionDigits: 1 });
const numShort = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
const dShort = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", timeZone: TZ });
const dLong = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: TZ });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (typeof u === "string" && /^https:\/\//.test(u) ? u : "#");
const fold = (s) => String(s ?? "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

let SPEC = null;
let VMETA = null;               // valuation methods, measured accuracy (web/valuation-meta.json)
const openFicha = new Set();    // lots with the detail sheet open
let ALL = [];
let shown = PAGE;
let showImages = false;
let store = null;               // persistence: Firestore (live) or this browser (preview)
let USER = { strategies: [], checklists: {}, alertState: {}, email: null, lastFilters: null, portfolio: [] };
let activeStrategy = null;      // strategy applied to the list
let editing = null;             // strategy being edited (a copy)

const NOW = Date.now();
const NOW_S = NOW / 1000;
const DAY = 86400000;

/* ---------- derived fields ---------- */
function enrich(x) {
  const rounds = (x.rounds || []).map((r) => ({ ...r, t: r.d ? Date.parse(r.d) : NaN }));
  const nd = nextDeadline(x, NOW_S);
  const endT = x.end ? Date.parse(x.end) : NaN;
  const proposals = /proposta/i.test(x.status || "");
  const ended = !Number.isNaN(endT) && endT < NOW && !proposals;
  let disc = x.disc ?? (x.appraisal && x.price ? 100 * (1 - x.price / x.appraisal) : null);
  let discBasis = "da avaliação";
  if (disc == null && rounds.length > 1 && rounds[0].v && x.price && rounds[0].v > x.price) {
    disc = 100 * (1 - x.price / rounds[0].v);
    discBasis = "vs 1ª praça";
  }
  const hay = [x.title, x.city, x.uf, x.hood, x.seller, x.type, SITES[x.src]].join(" ");
  return { ...x, rounds, nextT: nd == null ? NaN : nd * 1000, endT, ended, proposals,
           disc: disc == null ? null : Math.round(disc), discBasis, hay: fold(hay) };
}

/* ---------- quick filters (sidebar) ---------- */
const state = { q: "", src: new Set(), cat: new Set(["imovel"]), uf: "", ptype: "", pmin: null, pmax: null, dmin: null, hideEnded: true, onlyReview: false, sort: "ending" };

function readControls() {
  state.q = fold($("q").value.trim());
  state.uf = $("uf").value;
  state.ptype = $("ptype").value;
  state.pmin = $("pmin").value ? Number($("pmin").value) : null;
  state.pmax = $("pmax").value ? Number($("pmax").value) : null;
  state.dmin = $("dmin").value ? Number($("dmin").value) : null;
  state.hideEnded = $("hideEnded").checked;
  state.onlyReview = $("onlyReview").checked;
  state.sort = $("sort").value;
  state.src = new Set([...document.querySelectorAll("#srcChips input:checked")].map((i) => i.value));
  state.cat = new Set([...document.querySelectorAll("#catChips input:checked")].map((i) => i.value));
}

function quickMatch(x) {
  if (state.src.size && !state.src.has(x.src)) return false;
  if (state.cat.size && !state.cat.has(x.cat || "outros")) return false;
  if (state.uf && x.uf !== state.uf) return false;
  if (state.ptype && x.type !== state.ptype) return false;
  if (state.pmin != null && !(x.price >= state.pmin)) return false;
  if (state.pmax != null && !(x.price <= state.pmax)) return false;
  if (state.dmin != null && !(x.disc >= state.dmin)) return false;
  if (state.hideEnded && x.ended) return false;
  if (state.onlyReview && !USER.checklists[ckKey(x.id)]) return false;
  if (state.q && !state.q.split(/\s+/).every((w) => x.hay.includes(w))) return false;
  return true;
}

const SORTS = {
  ending: (a, b) => (isNaN(a.nextT) ? 1 : 0) - (isNaN(b.nextT) ? 1 : 0) || (a.nextT < NOW) - (b.nextT < NOW) || a.nextT - b.nextT,
  ptm: (a, b) => (a.ptm ?? Infinity) - (b.ptm ?? Infinity),
  ptmv: (a, b) => (a.ptmv ?? Infinity) - (b.ptmv ?? Infinity),
  roe: (a, b) => (roeFor(b)?.mid ?? -Infinity) - (roeFor(a)?.mid ?? -Infinity),
  chance: (a, b) => (chanceFor(b)?.profit ?? -1) - (chanceFor(a)?.profit ?? -1),
  discount: (a, b) => (b.disc ?? -1) - (a.disc ?? -1),
  priceAsc: (a, b) => (a.price ?? Infinity) - (b.price ?? Infinity),
  priceDesc: (a, b) => (b.price ?? -1) - (a.price ?? -1),
};

/* ---------- map ---------- */
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pinColor = (x) => cssVar(`--${{ good: "good", warn: "warn", bad: "bad", mute: "muted" }[roeClass(roeFor(x))]}`);

function popupHTML(x) {
  const r = roeFor(x);
  const where = [x.hood, x.city && x.uf ? `${x.city}/${x.uf}` : ""].filter(Boolean).join(", ");
  return `<a class="title" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>
    <span class="notice">${esc(where)} · ${esc(SITES[x.src] || x.src)}${x.geo === "cidade" ? " · posição aproximada (centro da cidade)" : ""}</span>
    <span><b>${x.price != null ? brl.format(x.price) : "—"}</b>${x.val ? ` · valor est. ${brlShort.format(x.val.lo50)}–${brlShort.format(x.val.hi50)}` : ""}</span>
    ${r ? `<span>ROE estimado <b>${pct(r.lo)} a ${pct(r.hi)}</b> (${pct(r.annual)} a.a. no central)</span>` : ""}
    ${isNaN(x.nextT) ? "" : `<span>Próxima data: ${dLong.format(x.nextT)}</span>`}
    <a class="btn btn-primary btn-sm go" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Abrir no site do leiloeiro ↗</a>`;
}

let mapTimer;
function renderMap(rows) {
  clearTimeout(mapTimer);
  mapTimer = setTimeout(() => drawMap(rows), 60);
}

async function drawMap(rows) {
  const pts = rows.filter((x) => x.lat != null && x.lon != null);
  const exact = pts.filter((x) => x.geo === "exato").length;
  $("mapNote").textContent = `${pts.length.toLocaleString("pt-BR")} de ${rows.length.toLocaleString("pt-BR")} no mapa · ${exact.toLocaleString("pt-BR")} com endereço exato, os demais no centro da cidade`;
  if (window.GOOGLE_MAPS_KEY) {
    try { await googleMap(pts); return; } catch (e) { $("mapNote").textContent += ` · Google Maps indisponível (${e.message}); usando o mapa simplificado`; }
  }
  await svgMap(pts);
}

/* Google Maps (when GOOGLE_MAPS_KEY is set in firebase-config.js) */
let gm = null;
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script"); s.src = src; s.async = true;
    s.onload = resolve; s.onerror = () => reject(new Error("falha ao carregar " + new URL(src).host));
    document.head.appendChild(s);
  });
}
async function googleMap(pts) {
  if (!gm) {
    const ready = new Promise((r) => (window.__gmReady = r));
    await Promise.all([
      loadScript(`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(window.GOOGLE_MAPS_KEY)}&v=weekly&language=pt-BR&region=BR&callback=__gmReady`).then(() => ready),
      loadScript("https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"),
    ]);
    const map = new google.maps.Map($("map"), { center: { lat: -14.5, lng: -51 }, zoom: 4, mapTypeControl: false, streetViewControl: false, gestureHandling: "greedy" });
    gm = { map, info: new google.maps.InfoWindow(), markers: [], cluster: new markerClusterer.MarkerClusterer({ map }) };
  }
  gm.cluster.clearMarkers();
  gm.markers.forEach((m) => m.setMap(null));
  gm.markers = pts.map((x) => {
    const m = new google.maps.Marker({
      position: { lat: x.lat, lng: x.lon }, title: x.title,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: pinColor(x), fillOpacity: 0.95, strokeColor: "#ffffff", strokeWeight: 1.5 },
    });
    m.addListener("click", () => { gm.info.setContent(`<div class="gm-pop">${popupHTML(x)}</div>`); gm.info.open({ map: gm.map, anchor: m }); });
    return m;
  });
  gm.cluster.addMarkers(gm.markers);
  if (pts.length) {
    const b = new google.maps.LatLngBounds();
    pts.forEach((x) => b.extend({ lat: x.lat, lng: x.lon }));
    gm.map.fitBounds(b, 40);
    if (pts.length === 1) gm.map.setZoom(14);
  }
}

/* Schematic map (no key needed): IBGE state outlines + one dot per property */
let STATES = null;
async function svgMap(pts) {
  if (!STATES) { try { STATES = (await (await fetch("brazil-states.json")).json()).states; } catch { STATES = []; } }
  let [w, e, s, n] = [-74.2, -34.6, -33.9, 5.4];   // Brazil
  if (pts.length && pts.length < ALL.length * 0.5) {  // a filtered set: zoom to it
    const lons = pts.map((x) => x.lon), lats = pts.map((x) => x.lat);
    const pad = 0.6;
    [w, e, s, n] = [Math.min(...lons) - pad, Math.max(...lons) + pad, Math.min(...lats) - pad, Math.max(...lats) + pad];
  }
  const k = Math.cos(((s + n) / 2) * Math.PI / 180);   // shrink longitude so shapes keep their proportions
  const X = (lon) => (lon - w) * k, Y = (lat) => n - lat;
  const vw = (e - w) * k, vh = n - s, r = Math.max(vw, vh) / 260;
  const ring = (pts2) => "M" + pts2.map(([lon, lat]) => `${X(lon).toFixed(3)},${Y(lat).toFixed(3)}`).join("L") + "Z";
  const outlines = STATES.map((st) => `<path class="uf" d="${st.rings.map(ring).join("")}"><title>${st.uf}</title></path>`).join("");
  const dots = pts.map((x, i) => `<circle class="pin" data-i="${i}" cx="${X(x.lon).toFixed(3)}" cy="${Y(x.lat).toFixed(3)}" r="${r.toFixed(3)}" fill="${pinColor(x)}"><title>${esc(x.title)}</title></circle>`).join("");
  $("map").innerHTML = `<svg viewBox="0 0 ${vw.toFixed(3)} ${vh.toFixed(3)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa dos imóveis filtrados">${outlines}${dots}</svg><div class="map-pop" id="mapPop" hidden></div>`;
  $("map").querySelector("svg").addEventListener("click", (ev) => {
    const c = ev.target.closest("circle.pin");
    const pop = $("mapPop");
    $("map").querySelectorAll(".pin.sel").forEach((el) => el.classList.remove("sel"));
    if (!c) { pop.hidden = true; return; }
    c.classList.add("sel");
    const x = pts[Number(c.dataset.i)];
    const box = $("map").getBoundingClientRect();
    pop.innerHTML = `<button class="close" type="button" aria-label="Fechar">×</button>${popupHTML(x)}`;
    pop.hidden = false;
    const left = Math.min(Math.max(ev.clientX - box.left + 12, 8), box.width - pop.offsetWidth - 8);
    const top = Math.min(Math.max(ev.clientY - box.top + 12, 8), box.height - pop.offsetHeight - 8);
    pop.style.left = `${left}px`; pop.style.top = `${top}px`;
    pop.querySelector(".close").onclick = () => { pop.hidden = true; c.classList.remove("sel"); };
  });
}

/* ---------- ROE (cost assumptions: the applied strategy's, else defaults) ---------- */
const roeCache = new Map();
let roeKey = "";
function roeFor(x) {
  const key = JSON.stringify(activeStrategy?.roe_assumptions || {});
  if (key !== roeKey) { roeCache.clear(); roeKey = key; }
  if (!roeCache.has(x.id)) roeCache.set(x.id, roeRange(x, activeStrategy?.roe_assumptions));
  return roeCache.get(x.id);
}
let chanceKey = "";
const chanceCache = new Map();
function chanceFor(x) {
  const key = JSON.stringify(activeStrategy?.roe_assumptions || {});
  if (key !== chanceKey) { chanceCache.clear(); chanceKey = key; }
  if (!chanceCache.has(x.id)) chanceCache.set(x.id, VMETA ? chances(x, VMETA.residual_quantiles, activeStrategy?.roe_assumptions) : null);
  return chanceCache.get(x.id);
}
const chanceClass = (p) => (p >= 70 ? "good" : p >= 50 ? "warn" : "bad");
function chancePill(x) {
  const c = chanceFor(x);
  return c ? `<span class="pill ${chanceClass(c.profit)}" title="Probabilidade de o imóvel valer mais que ${brl.format(c.breakeven)} (lance + custos), medida pelos erros reais do modelo">Chance de lucro est. ${c.profit}%</span>` : "";
}
const roeClass = (r) => (r == null ? "mute" : r.mid >= 20 ? "good" : r.mid >= 0 ? "warn" : "bad");
const pct = (n) => `${Math.round(n)}%`;
function roePill(x) {
  const r = roeFor(x);
  if (!r) return x.val?.flag ? `<span class="pill warn" title="Lance muito abaixo da avaliação estimada: costuma ser fração do imóvel ou área errada no anúncio">conferir dados</span>` : "";
  return `<span class="pill ${roeClass(r)}" title="Retorno sobre o capital, comprando à vista e revendendo na faixa provável de avaliação (premissas na estratégia). Anualizado no cenário central: ${pct(r.annual)} a.a. em ${r.months} meses.">ROE est. ${pct(r.lo)} a ${pct(r.hi)}</span>`;
}

/* ---------- "new" listings from the alert job ---------- */
function newIds() {
  const ids = new Set();
  for (const s of Object.values(USER.alertState.strategies || {})) for (const id of s.new || []) ids.add(id);
  return ids;
}

/* ---------- lot rendering ---------- */
function deadline(x) {
  const t = x.nextT;
  if (isNaN(t)) return x.status ? `<span class="pill mute">${esc(x.status)}</span>` : "";
  const dt = t - NOW;
  if (dt < 0) return x.proposals ? `<span class="pill warn">Aceita propostas</span>` : `<span class="pill mute">Encerrado ${dShort.format(t)}</span>`;
  const days = Math.floor(dt / DAY);
  const label = dt < DAY ? `Hoje, ${dLong.format(t).slice(-5)}` : days === 1 ? "Amanhã" : `Em ${days} dias`;
  const cls = dt < DAY ? "bad" : days < 7 ? "warn" : "mute";
  return `<span class="pill ${cls}" title="${esc(dLong.format(t))}">${label}</span>`;
}

function initials(x) {
  const t = x.type || CATS[x.cat] || "Lote";
  return esc(t.replace(/[^A-Za-zÀ-ú ]/g, "").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "L");
}

function ptmPill(x) {
  if (x.ptm == null) return "";
  const cls = x.ptm <= 50 ? "good" : x.ptm <= 70 ? "warn" : "mute";
  const est = x.mvo ? "" : " (estimativa)";
  return `<span class="pill ${cls}" title="Valor de mercado ${brl.format(x.mv)} — fonte: ${esc(x.mvs)}">Lance = ${Math.round(x.ptm)}% do mercado${est}</span>`;
}


function lotHTML(x, isNew) {
  const where = [x.hood, x.city && x.uf ? `${x.city}/${x.uf}` : x.city || x.uf].filter(Boolean).join(", ");
  const rounds = x.rounds.length > 1 || (x.rounds.length === 1 && x.rounds[0].v && x.rounds[0].v !== x.price)
    ? `<div class="rounds">${x.rounds.map((r) => `<span class="round${r.t < NOW ? " past" : ""}"><b>${r.n}ª praça</b> ${isNaN(r.t) ? "" : dShort.format(r.t)} ${r.v ? brlShort.format(r.v) : ""}</span>`).join("")}</div>`
    : "";
  const img = showImages && x.img ? `<img src="${esc(safeUrl(x.img))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  const debts = x.debts === true ? `<span class="tag warn" title="${esc(x.debtsrc || "")}">Dívidas: arrematante</span>`
    : x.debts === false ? `<span class="tag good" title="${esc(x.debtsrc || "")}">Dívidas: vendedor</span>` : "";
  const ck = USER.checklists[ckKey(x.id)];
  const open = openFicha.has(x.id);
  const r = roeFor(x), ch = chanceFor(x);
  return `<article class="lot${open ? " open" : ""}" data-id="${esc(x.id)}">
    <div class="lot-row">
      <div class="thumb" aria-hidden="true">${img || initials(x)}</div>
      <div class="lot-main">
        <a class="lot-title" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>
        <div class="meta">${where ? `<span>${esc(where)}</span>` : ""}${x.area ? `<span>${x.area.toLocaleString("pt-BR")} m²</span>` : ""}${x.beds ? `<span>${x.beds} quarto${x.beds > 1 ? "s" : ""}</span>` : ""}</div>
        <div class="tags">${isNew ? `<span class="tag new">Novo</span>` : ""}<span class="tag src">${esc(SITES[x.src] || x.src)}</span>${x.type ? `<span class="tag">${esc(x.type)}</span>` : ""}${x.modn ? `<span class="tag">${esc(x.modn.replace("_", " "))}</span>` : ""}${debts}${ck ? `<span class="tag">Em análise · ${ckDone(ck)}/6</span>` : ""}</div>
        ${rounds}
      </div>
      <div class="price-col">
        <div class="price">${x.price != null ? brl.format(x.price) : "—"}</div>
        ${x.val && !x.val.flag ? `<div class="bar-cap">Valor est. ${brlShort.format(x.val.lo50)}–${brlShort.format(x.val.hi50)}</div>${rangeBar(x)}` : ""}
        ${r ? `<div class="bar-cap">ROE est. ${pct(r.lo)} a ${pct(r.hi)}</div>${roeBar(r)}` : ""}
        <div class="tags" style="justify-content:flex-end">${ch ? `<span class="pill ${chanceClass(ch.profit)}" title="Estimativa: probabilidade de o imóvel valer mais que ${brl.format(ch.breakeven)} (lance + custos)">Chance de lucro est. ${ch.profit}%</span>` : ""}${x.val?.flag ? `<span class="pill warn" title="Lance muito abaixo do valor estimado: costuma ser fração do imóvel ou área errada no anúncio">conferir dados</span>` : ""}${deadline(x)}</div>
      </div>
      <button class="expand" type="button" data-ficha="${esc(x.id)}" aria-expanded="${open}" aria-label="${open ? "Fechar ficha" : "Abrir ficha completa"}" title="${open ? "Fechar ficha" : "Ficha completa: custos, ROE, cidade e checklist"}">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    ${open ? fichaHTML(x) : ""}
  </article>`;
}


/* ---------- ficha (detail sheet) ---------- */
const simState = new Map();   // per lot: resale value and cost sliders in the simulator

function fichaHTML(x) {
  const off = x.mvo && x.mv ? x.mv : x.appraisal;
  const facts = [
    ["Comitente", x.seller], ["Tipo de leilão", x.modn ? x.modn.replace("_", " ") : null],
    ["Ocupação", x.occ === true ? "Ocupado" : x.occ === false ? "Desocupado" : "Não informado"],
    ["Dívidas (condomínio/IPTU)", x.debts === true ? "Ficam com o arrematante" : x.debts === false ? "Pagas pelo vendedor" : "Não informado"],
    ["Avaliação oficial", off ? `${brl.format(off)}${x.ptm != null ? ` · lance = ${Math.round(x.ptm)}% dela` : ""}` : null],
    ["Área", x.area ? `${x.area.toLocaleString("pt-BR")} m²` : null], ["Quartos", x.beds],
  ].filter(([, v]) => v != null && v !== "");
  const natl = SPEC?.reference?.national_gdp_per_capita;
  const city = [
    ["População", x.pop ? `${x.pop.toLocaleString("pt-BR")} hab.` : null],
    ["IDH-M", x.idhm ? `${x.idhm.toFixed(3).replace(".", ",")} ${x.idhm >= 0.8 ? "(muito alto)" : x.idhm >= 0.7 ? "(alto)" : x.idhm >= 0.6 ? "(médio)" : "(baixo)"}` : null],
    ["PIB per capita", x.gdppc ? `${brl.format(x.gdppc)}${natl ? ` (${x.gdppc >= natl ? "acima" : "abaixo"} da média nacional de ${brlShort.format(natl)})` : ""}` : null],
    ["Agronegócio no PIB", x.agro != null ? `${Math.round(x.agro)}%` : null], ["Capital", x.cap ? "Sim" : null],
  ].filter(([, v]) => v);
  const dl = (rows) => `<dl class="facts">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  return `<div class="ficha">
    <p class="estimate-note">Valores, ROE e chances desta ficha são <b>estimativas</b> de um modelo com dados públicos. Não são laudo de avaliação nem recomendação de investimento: confira o edital e visite o imóvel.</p>
    <section class="fsec"><h3>Imóvel</h3>${dl(facts)}
      <div class="st-actions"><a class="btn btn-primary btn-sm" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Abrir no site do leiloeiro ↗</a>
        <button class="btn btn-sm" type="button" data-won="${esc(x.id)}">Arrematei: adicionar ao portfólio</button></div></section>
    ${city.length ? `<section class="fsec"><h3>${esc(x.city || "Cidade")}${x.uf ? `/${esc(x.uf)}` : ""}</h3>${dl(city)}<p class="help">IBGE (Censo 2022, PIB dos Municípios) e PNUD (IDH-M 2010).</p></section>` : ""}
    <section class="fsec"><h3>Valor estimado</h3>${x.val && VMETA && !x.val.flag ? valHTML(x) : noValHTML(x)}</section>
    ${x.price ? `<section class="fsec"><h3>Retorno estimado (ROE) e custos</h3><div id="sim-${ckKey(x.id)}">${simHTML(x)}</div></section>` : ""}
    <section class="fsec"><h3>Checklist de due diligence</h3>${ddHTML(x)}</section>
  </div>`;
}

/* Official appraisal from the edital, scaled to the share being sold. */
const officialOf = (x) => (x.mvo && x.mv ? x.mv : x.appraisal) || null;
const VALUED_KINDS = new Set(["casa", "casa_condominio", "apartamento", "comercial"]);  // valuation.py RESIDENTIAL | COMMERCIAL
function kindLabel(k) {
  const opts = (SPEC?.sets || []).find((f) => f.key === "kind")?.options || [];
  return (opts.find((o) => o[0] === k)?.[1] || k || "este tipo de imóvel").toLowerCase();
}
// Why a lot has no model estimate, in the investor's terms.
function noValReason(x) {
  if (x.val?.flag) return "O lance está abaixo de 20% do valor que o modelo calculou. Isso costuma indicar venda de uma fração do imóvel (parte ideal) ou área errada no anúncio, então a estimativa foi ocultada. Confira no edital.";
  if (!VALUED_KINDS.has(x.kind)) return `O modelo de valor cobre casas, apartamentos e salas/lojas comerciais. Para ${kindLabel(x.kind)} ainda não há base de comparação confiável: o FipeZAP mede preços de imóveis construídos.`;
  if (!x.area) return "O anúncio não informa a área construída, e todos os métodos do modelo partem do preço por m².";
  return "A cidade ou a área do anúncio não têm dados suficientes nas bases públicas (FipeZAP, IBGE) para uma estimativa.";
}
function noValHTML(x) {
  const off = officialOf(x);
  return `<p class="why-none">${esc(noValReason(x))}</p>
    ${off ? `<p class="why-none">Avaliação oficial do edital: <b>${brl.format(off)}</b>${x.price ? ` · lance = ${Math.round((100 * x.price) / off)}% dela` : ""}. O simulador abaixo parte dela.</p>`
      : `<p class="why-none">Sem avaliação oficial no anúncio. No simulador abaixo, informe o valor pelo qual espera vender, com base em imóveis parecidos na região.</p>`}`;
}

/* Resale range the simulator works in: the model's range; else the official
   appraisal ±; else from the breakeven point, which the investor adjusts. */
function simBase(x, a) {
  if (x.val && !x.val.flag) return { lo: x.val.lo, mid: x.val.mid, hi: x.val.hi, src: "model" };
  const off = officialOf(x);
  if (off) return { lo: Math.min(off * 0.6, x.price), mid: off, hi: Math.max(off * 1.5, x.price * 1.5), src: "official" };
  let be = valueNeeded(x.price, 0, x.debts, x.occ, a, x.modn === "judicial");
  if (!isFinite(be)) be = x.price * 2;
  const mid = Math.ceil(be / 1000) * 1000;
  return { lo: x.price * 0.8, mid, hi: Math.max(x.price * 3, mid * 2), src: "breakeven" };
}
function simDefault(x, a) {
  return { value: simBase(x, a).mid, reno: (a.renovation_min_pct + a.renovation_max_pct) / 2, furn: a.furniture_pct };
}

/* Interactive ROE: drag the resale value and the cost sliders; every cost listed. */
function simHTML(x) {
  const a = roeAssumptions(activeStrategy?.roe_assumptions), v = simBase(x, a);
  const st = simState.get(x.id) || simDefault(x, a);
  const aa = { ...a, furniture_pct: st.furn };
  const j = x.modn === "judicial";
  const f = flip(x.price, st.value, x.debts, x.occ, aa, j, st.reno);
  const r = roeFor(x);
  const occ = x.occ === true || (x.occ == null && a.assume_occupied >= 1);
  const lawyerWhy = occ ? "imóvel ocupado: ação de imissão na posse" : j ? "leilão judicial: acompanhamento do processo" : "não necessário neste caso";
  const rows = [
    ["Lance", f.costs.bid, "valor do lote"],
    [`Comissão (${a.commission_pct}%), ITBI (${a.itbi_pct}%) e registro (${a.registry_pct}%)`, f.costs.fees, "sobre o lance"],
    ["Documentação (certidões, despachante)", f.costs.docs, "valor fixo"],
    [`Reforma (${st.reno.toFixed(1).replace(".", ",")}% do valor)`, f.costs.renovation, `faixa da estratégia: ${a.renovation_min_pct}% a ${a.renovation_max_pct}%`],
    [`Mobília e eletrodomésticos (${st.furn}% do valor)`, f.costs.furniture, st.furn ? "para alugar mobiliado ou valorizar a venda" : "não incluído"],
    [`Dívidas de condomínio/IPTU (${a.debts_pct}% do valor)`, f.costs.debts, x.debts === true ? "o edital deixa com o arrematante" : x.debts === false ? "o vendedor paga" : "não informado: não incluído"],
    [`Desocupação (${a.eviction_pct}% do valor, +${a.eviction_months} meses)`, f.costs.eviction, occ ? (x.occ === true ? "imóvel ocupado" : "ocupação desconhecida tratada como ocupado") : x.occ === false ? "desocupado" : "ocupação não informada: não incluída"],
    ["Advogado", f.costs.legal, lawyerWhy],
    [`Condomínio + IPTU por ${f.months} meses`, f.costs.carrying, `${a.carrying_pct_month}% do valor por mês até vender`],
  ];
  return `<div class="sim">
    ${r ? `<div class="bar-cap">ROE est. ${pct(r.lo)} (pessimista) · ${pct(r.mid)} (central) · ${pct(r.hi)} (otimista)</div>${roeBar(r, true)}`
      : v.src === "official" ? `<p class="why-none">Sem faixa do modelo: a revenda começa na avaliação oficial. Ajuste para o valor que você espera.</p>`
      : `<p class="why-none">Sem estimativa de valor: a revenda começa no ponto de empate (${brl.format(v.mid)}), onde o ROE é zero. Arraste até o valor pelo qual espera vender.</p>`}
    <div class="sim-ctl">
      <label>Revenda por <b>${brl.format(st.value)}</b>
        <input type="range" data-sim="value" data-sim-id="${esc(x.id)}" min="${Math.round(v.lo)}" max="${Math.round(v.hi)}" step="${Math.max(1000, Math.round((v.hi - v.lo) / 200 / 1000) * 1000)}" value="${Math.round(st.value)}"></label>
      <label>Reforma: <b>${st.reno.toFixed(1).replace(".", ",")}%</b> do valor
        <input type="range" data-sim="reno" data-sim-id="${esc(x.id)}" min="0" max="${Math.max(30, a.renovation_max_pct)}" step="0.5" value="${st.reno}"></label>
      <label>Mobília: <b>${st.furn}%</b> do valor
        <input type="range" data-sim="furn" data-sim-id="${esc(x.id)}" min="0" max="15" step="0.5" value="${st.furn}"></label>
    </div>
    <div class="table-wrap"><table class="vt"><thead><tr><th>Custo</th><th class="num">R$</th><th>Por quê</th></tr></thead><tbody>
      ${rows.map(([k, n, why]) => `<tr class="${n ? "" : "na"}"><td class="name">${esc(k)}</td><td class="num">${brl.format(n)}</td><td class="why">${esc(why)}</td></tr>`).join("")}
      <tr class="sum"><td class="name"><b>Capital investido</b></td><td class="num"><b>${brl.format(f.equity)}</b></td><td></td></tr>
      <tr><td class="name">Venda</td><td class="num">${brl.format(st.value)}</td><td class="why">valor de revenda escolhido acima</td></tr>
      <tr><td class="name">Corretagem (${a.broker_pct}%)</td><td class="num">−${brl.format(f.broker)}</td><td class="why">sobre a venda</td></tr>
      <tr><td class="name">IR sobre o lucro (${a.tax_pct}%)</td><td class="num">−${brl.format(f.tax)}</td><td class="why">ganho de capital, pessoa física</td></tr>
      <tr class="sum"><td class="name"><b>Lucro líquido estimado</b></td><td class="num"><b>${brl.format(f.profit)}</b></td><td class="why"><b>ROE est. ${pct(100 * f.roe)}</b> · ${pct(100 * f.annual)} ao ano</td></tr>
    </tbody></table></div>
    <p class="help">À vista, sem financiamento. Mude as porcentagens padrão nas premissas da sua estratégia (aba Estratégias).</p>
  </div>`;
}

/* ROE bar: band = pessimistic..optimistic, line = central, red = 0% (breakeven), dashed = 20%. */
function roeBar(r, big = false) {
  // scale from at least -15%..45%, capped at 150% so 0% and 20% stay readable
  const lo = Math.max(Math.min(r.lo, -10), -100) - 5, hi = Math.min(Math.max(r.hi, 40), 150) + 5;
  const pos = (n) => `${Math.min(100, Math.max(0, (100 * (n - lo)) / (hi - lo))).toFixed(1)}%`;
  const cls = r.mid >= 20 ? "good" : r.mid >= 0 ? "warn" : "bad";
  return `<div class="rbar roe ${cls}${big ? " big" : ""}" role="img" aria-label="ROE estimado de ${pct(r.lo)} a ${pct(r.hi)}, central ${pct(r.mid)}">
    <div class="rb-track"></div>
    <div class="rb-50" style="left:${pos(r.lo)};right:calc(100% - ${pos(r.hi)})"></div>
    <div class="rb-mid" style="left:${pos(r.mid)}"></div>
    <div class="rb-be" style="left:${pos(0)}" title="0%: empate"></div>
    <div class="rb-tgt" style="left:${pos(20)}" title="20%"></div>
    ${big ? `<span class="rb-lbl" style="left:${pos(0)}">0%</span><span class="rb-lbl" style="left:${pos(20)}">20%</span>` : ""}
  </div>`;
}

/* ---------- valuation panel ---------- */
function valHTML(x) {
  const v = x.val, methods = VMETA.methods;
  const weight = (m) => 1 / Math.max(methods[m].mdape || 0.5, 0.05) ** 2;
  const present = Object.keys(x.vm || {});
  const wmap = Object.fromEntries(present.map((m) => [m, weight(m)]));
  if (wmap.m0 != null) {  // same rule as valuation.py: official appraisal = 3x all models combined
    const models = present.filter((m) => m !== "m0").reduce((s, m) => s + wmap[m], 0);
    wmap.m0 = Math.max(wmap.m0, 3 * models);
  }
  const wsum = present.reduce((s, m) => s + wmap[m], 0);
  const ch = chanceFor(x);
  const a = roeAssumptions(activeStrategy?.roe_assumptions);
  const target = valueNeeded(x.price || 0, 0.2, x.debts, x.occ, a, x.modn === "judicial");
  const rows = Object.entries(methods).map(([m, meta]) => {
    const val = (x.vm || {})[m];
    return `<tr class="${val ? "" : "na"}"><td class="name">${esc(meta.name)}</td>
      <td class="num">${val ? brl.format(val) : "sem dados"}</td>
      <td class="num">${meta.mdape != null ? (meta.assumed ? "~" : "") + Math.round(meta.mdape * 100) + "%" + (meta.assumed ? " (premissa)" : "") : "—"}</td>
      <td class="num">${val ? Math.round((100 * wmap[m]) / wsum) + "%" : "—"}</td></tr>`;
  }).join("");
  const c = VMETA.combined;
  const verdict = !x.price ? "" : x.price < v.lo ? "O lance está abaixo até do cenário pessimista: margem de segurança grande."
    : x.price < v.lo50 ? "O lance está abaixo da faixa provável de valor." : x.price <= v.hi50 ? "O lance está dentro da faixa provável de valor: pouca margem." : "O lance está acima da faixa provável de valor.";
  return `<div class="val">
    <div class="val-head"><span>Valor provável (estimado) <b>${brl.format(v.lo50)} – ${brl.format(v.hi50)}</b></span>
      <span class="pill ${v.conf === "alta" ? "good" : v.conf === "média" ? "warn" : "mute"}" title="Quantos métodos tiveram dados e o quanto concordam">confiança ${v.conf}</span></div>
    ${rangeBar(x, true)}
    <ul class="val-facts">
      <li>${verdict}</li>
      <li>Metade das avaliações reais cai entre <b>${brl.format(v.lo50)}</b> e <b>${brl.format(v.hi50)}</b>; 8 em cada 10, entre ${brl.format(v.lo)} e ${brl.format(v.hi)}. Valor central: ${brl.format(v.mid)}.</li>
      ${ch ? `<li>Para não ter prejuízo (lance + todos os custos), o imóvel precisa valer pelo menos <b>${brl.format(ch.breakeven)}</b>. <span class="pill ${chanceClass(ch.profit)}">Chance de lucro est. ${ch.profit}%</span></li>
      <li>Para um ROE de 20% ou mais, precisa valer <b>${brl.format(target)}</b>. Chance estimada: <b>${ch.target}%</b>.</li>` : ""}
    </ul>
    <details class="how"><summary>Como calculamos</summary>
      <div class="table-wrap"><table class="vt"><thead><tr><th>Método</th><th class="num">Valor</th><th class="num">Erro mediano medido</th><th class="num">Peso</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="help">Cada método foi calibrado e testado contra ${VMETA.n_official} avaliações oficiais de leilão que ele não tinha visto. O valor central combina os métodos dando mais peso aos mais precisos e errou em mediana ${Math.round(c.mdape * 100)}%. As chances vêm da distribuição desses erros: se o modelo errou para cima em 3 de cada 10 casos parecidos, a chance de o imóvel valer menos que a estimativa reflete isso. Use como referência, não como laudo. FipeZAP ${esc(VMETA.sources.fipezap)}, SINAPI ${esc(VMETA.sources.sinapi)}.</p>
    </details>
  </div>`;
}

/* Range bar: light band = 80% of real appraisals, dark band = 50%, line =
   central value, ▲ = bid, red tick = breakeven (value needed to not lose money). */
function rangeBar(x, big = false) {
  const v = x.val;
  if (!v || !x.price || v.flag) return "";
  const ch = chanceFor(x);
  const pts = [v.lo, v.hi, x.price, ch?.breakeven].filter((n) => n > 0);
  const lo = Math.min(...pts) * 0.92, hi = Math.max(...pts) * 1.08;
  const pos = (n) => `${Math.min(100, Math.max(0, (100 * (Math.log(n) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))))).toFixed(1)}%`;
  // labels stay inside the bar so text near the edges isn't cut off
  const lpos = (n) => `${Math.min(92, Math.max(8, (100 * (Math.log(n) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))))).toFixed(1)}%`;
  const label = `Valor provável entre ${brl.format(v.lo50)} e ${brl.format(v.hi50)}; lance ${brl.format(x.price)}${ch ? `; empate em ${brl.format(ch.breakeven)}` : ""}`;
  return `<div class="rbar${big ? " big" : ""}" role="img" aria-label="${esc(label)}" title="${esc(label)}">
    <div class="rb-track"></div>
    <div class="rb-80" style="left:${pos(v.lo)};right:calc(100% - ${pos(v.hi)})"></div>
    <div class="rb-50" style="left:${pos(v.lo50)};right:calc(100% - ${pos(v.hi50)})"></div>
    <div class="rb-mid" style="left:${pos(v.mid)}"></div>
    ${ch ? `<div class="rb-be" style="left:${pos(ch.breakeven)}"></div>` : ""}
    <div class="rb-bid" style="left:${pos(x.price)}"></div>
    ${big ? `<span class="rb-lbl" style="left:${lpos(v.lo)}">${brlShort.format(v.lo)}</span>
      <span class="rb-lbl" style="left:${lpos(v.mid)}">${brlShort.format(v.mid)}</span>
      <span class="rb-lbl" style="left:${lpos(v.hi)}">${brlShort.format(v.hi)}</span>
      <span class="rb-lbl bid" style="left:${lpos(x.price)}">lance ${brlShort.format(x.price)}</span>` : ""}
  </div>
  ${big ? `<div class="legend"><span><i style="background:var(--accent-soft)"></i>possível (8 em 10)</span><span><i style="background:var(--accent);opacity:.45"></i>provável (5 em 10)</span><span><i style="background:var(--accent)"></i>valor central</span><span><i style="background:var(--good)"></i>lance</span><span><i style="background:var(--bad)"></i>empate (sem lucro nem prejuízo)</span></div>` : ""}`;
}

/* ---------- due-diligence checklist ---------- */
const ckKey = (id) => id.replace(/[^A-Za-z0-9_-]/g, "_");
const DD_ITEMS = [
  ["edital", "Li o edital (pagamento, comissão do leiloeiro, condições de venda)"],
  ["debts", "Confirmei no edital quem paga condomínio, IPTU e outras dívidas"],
  ["lawsuits", "Pesquisei ações do ex-mutuário contra o banco (ex.: ação anulatória)"],
  ["matricula", "Conferi a matrícula atualizada no cartório de registro de imóveis"],
  ["occupancy", "Verifiquei se o imóvel está ocupado e o custo de desocupação"],
  ["visit", "Visitei ou vi o imóvel por fora"],
];
const ckDone = (ck) => DD_ITEMS.filter(([k]) => ck[k]).length;

function ddHelp(key, x) {
  if (key === "debts") {
    const auto = x.debts === true ? "Leitura automática: dívidas ficam com o arrematante" : x.debts === false ? "Leitura automática: vendedor entrega livre de dívidas" : "Leitura automática: o anúncio não informa";
    return `<span>${auto}${x.debtsrc ? ` (${esc(x.debtsrc)})` : ""}. Confirme no edital.</span>`;
  }
  if (key === "lawsuits") {
    const tj = x.uf === "SP" ? `<a href="https://esaj.tjsp.jus.br/cpopg/open.do" target="_blank" rel="noopener noreferrer">TJSP (e-SAJ)</a>` : "";
    return `<span>Use o nome ou CPF do ex-mutuário que consta no edital. O AuctionTraker não guarda CPFs.</span>
      <a href="https://www.jusbrasil.com.br/consulta-processual/" target="_blank" rel="noopener noreferrer">Jusbrasil</a>
      <a href="https://www.escavador.com/" target="_blank" rel="noopener noreferrer">Escavador</a>${tj}
      <select class="input" data-ck-field="lawsuits_result" data-ck-id="${esc(x.id)}" style="max-width:260px">
        ${[["", "Resultado da pesquisa…"], ["none", "Nada encontrado"], ["found", "Encontrei ação — risco"], ["unclear", "Inconclusivo"]].map(([v, l]) => `<option value="${v}" ${(USER.checklists[ckKey(x.id)] || {}).lawsuits_result === v ? "selected" : ""}>${l}</option>`).join("")}

function ddHTML(x) {

async function saveCheck(id, field, value) {
  const k = ckKey(id);
  const ck = { ...(USER.checklists[k] || {}), [field]: value, updated: new Date().toISOString() };
  USER.checklists[k] = ck;
  await store.saveChecklist(k, ck);
}

/* ---------- list view ---------- */
function median(nums) {
  if (!nums.length) return null;
  const s = [...nums].sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function render() {
  readControls();
  let rows = ALL;
  if (activeStrategy) rows = rows.filter((x) => matchesStrategy(SPEC, activeStrategy, x, NOW_S));
  rows = rows.filter(quickMatch).sort(SORTS[state.sort]);
  const fresh = newIds();
  const week = rows.filter((x) => x.nextT >= NOW && x.nextT - NOW < 7 * DAY).length;
  const ptms = rows.map((x) => x.ptm).filter((d) => d != null);
  const under50 = ptms.filter((p) => p <= 50).length;
  const prices = rows.map((x) => x.price).filter((p) => p > 0);
  $("stats").innerHTML = [
    ["Oportunidades", rows.length.toLocaleString("pt-BR"), `de ${ALL.length.toLocaleString("pt-BR")} coletadas`],
    ["Encerram em 7 dias", week.toLocaleString("pt-BR"), "próxima praça ou prazo"],
    ["Lance ≤ 50% do mercado", under50.toLocaleString("pt-BR"), `${ptms.length.toLocaleString("pt-BR")} com valor de mercado`],
    ["Preço mediano", prices.length ? brlShort.format(median(prices)) : "—", "lance mínimo / preço atual"],
  ].map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  $("stBanner").hidden = !activeStrategy;
  if (activeStrategy) {
    $("stBanner").innerHTML = `<span>Estratégia aplicada: <b>${esc(activeStrategy.name)}</b></span><span class="spacer"></span>
      <button class="btn btn-sm" type="button" id="editActive">Editar</button><button class="btn btn-sm" type="button" id="clearActive">Remover</button>`;
    $("clearActive").onclick = () => { activeStrategy = null; shown = PAGE; render(); };
    $("editActive").onclick = () => openEditor(USER.strategies.find((s) => s.id === activeStrategy.id) || activeStrategy);
  }

  $("resultCount").textContent = `${rows.length.toLocaleString("pt-BR")} resultado${rows.length === 1 ? "" : "s"}`;
  const onMap = document.querySelector('input[name="view"]:checked')?.value === "map";
  $("list").hidden = onMap; $("mapWrap").hidden = !onMap;
  if (onMap) { $("more").hidden = true; renderMap(rows); setActiveCount(); return; }
  const page = rows.slice(0, shown);
  $("list").innerHTML = page.length
    ? page.map((x) => lotHTML(x, fresh.has(x.id))).join("")
    : `<div class="empty"><strong>Nenhum lote com esses filtros.</strong><span>Tente ampliar o preço, remover o estado ou desmarcar “Ocultar encerrados”.</span></div>`;
  $("more").hidden = rows.length <= shown;
  $("more").textContent = `Mostrar mais (${(rows.length - shown).toLocaleString("pt-BR")} restantes)`;
  setActiveCount();
}

function setActiveCount() {
  const n = state.src.size + (state.cat.size && !(state.cat.size === 1 && state.cat.has("imovel")) ? 1 : 0) +
    [state.q, state.uf, state.ptype, state.pmin, state.pmax, state.dmin].filter((v) => v !== "" && v != null).length + (state.onlyReview ? 1 : 0);
  $("activeCount").textContent = n ? `${n} ativo${n > 1 ? "s" : ""}` : "";
}

/* ---------- remember the user's filters ---------- */
let saveTimer;
function snapshotFilters() {
  return { q: $("q").value, src: [...state.src], cat: [...state.cat], uf: state.uf, ptype: state.ptype,
           pmin: state.pmin, pmax: state.pmax, dmin: state.dmin, hideEnded: state.hideEnded, sort: state.sort };
}
function persistFilters() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store?.saveFilters?.(snapshotFilters()).catch?.(() => {}), 1500);
}
function restoreFilters(f) {
  if (!f) return;
  $("q").value = f.q || ""; $("uf").value = f.uf || ""; $("ptype").value = f.ptype || "";
  $("pmin").value = f.pmin ?? ""; $("pmax").value = f.pmax ?? ""; $("dmin").value = f.dmin ?? "";
  $("hideEnded").checked = f.hideEnded !== false; if (f.sort) $("sort").value = f.sort;
  document.querySelectorAll("#srcChips input").forEach((i) => (i.checked = (f.src || []).includes(i.value)));
  if (f.cat) document.querySelectorAll("#catChips input").forEach((i) => (i.checked = f.cat.includes(i.value)));
}
function strategyFromFilters() {
  readControls();
  const st = blankStrategy();
  st.name = [state.uf, state.ptype, state.pmax ? `até ${brlShort.format(state.pmax)}` : ""].filter(Boolean).join(" · ") || "Minha busca";
  if (state.uf) st.sets.uf = { values: [state.uf], unknown: false };
  if (state.pmin != null || state.pmax != null) st.ranges.price = { min: state.pmin, max: state.pmax, unknown: false };
  if (state.dmin != null) st.ranges.disc = { min: state.dmin, max: null, unknown: false };
  if (state.q) st.neighborhoods = state.q.split(/[,;]/).map((t) => t.trim()).filter(Boolean);
  st.hide_ended = state.hideEnded;
  return st;
}

function buildControls() {
  const count = (key) => ALL.reduce((m, x) => (m[x[key]] = (m[x[key]] || 0) + 1, m), {});
  const srcN = count("src"), catN = count("cat");
  $("srcChips").innerHTML = Object.keys(SITES).filter((k) => srcN[k]).map((k) =>
    `<label class="chip-toggle"><input type="checkbox" id="src-${k}" value="${k}"><span>${SITES[k]} <small>${srcN[k]}</small></span></label>`).join("");
  $("catChips").innerHTML = Object.keys(CATS).filter((k) => catN[k]).map((k) =>
    `<label class="chip-toggle"><input type="checkbox" id="cat-${k}" value="${k}" ${state.cat.has(k) ? "checked" : ""}><span>${CATS[k]} <small>${catN[k]}</small></span></label>`).join("");
  const ufs = [...new Set(ALL.map((x) => x.uf).filter(Boolean))].sort();
  $("uf").innerHTML = `<option value="">Todos</option>` + ufs.map((u) => `<option>${u}</option>`).join("");
  const types = Object.entries(count("type")).filter(([t, n]) => t !== "undefined" && n >= 3).sort((a, b) => b[1] - a[1]);
  $("ptype").innerHTML = `<option value="">Todos</option>` + types.map(([t]) => `<option>${esc(t)}</option>`).join("");

  const rerender = () => { shown = PAGE; render(); persistFilters(); };
  $("saveAsStrategy").addEventListener("click", () => openEditor(strategyFromFilters(), true));
  let timer;
  $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(rerender, 150); });
  for (const id of ["uf", "ptype", "dmin", "hideEnded", "onlyReview", "sort", "pmin", "pmax"]) $(id).addEventListener("change", rerender);
  $("srcChips").addEventListener("change", rerender);
  document.querySelectorAll('input[name="view"]').forEach((i) => i.addEventListener("change", rerender));
  $("catChips").addEventListener("change", rerender);
  $("more").addEventListener("click", () => { shown += PAGE; render(); });
  $("reset").addEventListener("click", () => {
    for (const id of ["q", "uf", "ptype", "pmin", "pmax", "dmin"]) $(id).value = "";
    $("hideEnded").checked = true; $("onlyReview").checked = false;
    document.querySelectorAll("#srcChips input").forEach((i) => (i.checked = false));
    document.querySelectorAll("#catChips input").forEach((i) => (i.checked = i.value === "imovel"));
    rerender();
  });
  $("list").addEventListener("click", (e) => {
    const won = e.target.closest("[data-won]");
    if (won) { const x = ALL.find((l) => l.id === won.dataset.won); if (x) { editingProp = propertyFromListing(x); showTab("portfolio"); } return; }
    const b = e.target.closest("[data-ficha]");
    if (!b) return;
    const id = b.dataset.ficha;
    openFicha.has(id) ? openFicha.delete(id) : openFicha.add(id);
    render();
  });
  // ROE simulator: recompute only that lot's simulator while dragging
  $("list").addEventListener("input", (e) => {
    const el = e.target.closest("[data-sim]");
    if (!el) return;
    const id = el.dataset.simId, x = ALL.find((l) => l.id === id);
    const a = roeAssumptions(activeStrategy?.roe_assumptions);
    const st = simState.get(id) || simDefault(x, a);
    st[el.dataset.sim] = Number(el.value);
    simState.set(id, st);
    const box = document.getElementById(`sim-${ckKey(id)}`);
    box.innerHTML = simHTML(x);
    box.querySelector(`[data-sim="${el.dataset.sim}"]`)?.focus();
  });
  $("list").addEventListener("change", async (e) => {
    const el = e.target.closest("[data-ck-field]");
    if (!el) return;
    await saveCheck(el.dataset.ckId, el.dataset.ckField, el.type === "checkbox" ? el.checked : el.value);
    if (el.type === "checkbox") render();
  });
  if (window.matchMedia("(max-width: 900px)").matches) $("filters").open = false;
}

/* ---------- strategies ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);

function presetStrategy() {
  const p = JSON.parse(JSON.stringify(SPEC.presets.abaixo50).replace('"NATIONAL_GDP_PC"', String(SPEC.reference.national_gdp_per_capita)));
  return { id: uid(), ...p };
}
function blankStrategy() {
  return { id: uid(), name: "Nova estratégia", enabled: true, email: true, hide_ended: true, city_mode: "all", debts: "any",
           sets: {}, ranges: {}, toggles: {}, cities: [], neighborhoods: [] };
}

function strategySummary(st) {
  const bits = [];
  const fmt = (r, v) => r.unit === "R$" ? brlShort.format(v) : r.key === "pop" ? numShort.format(v) : `${String(v).replace(".", ",")}${r.unit && r.unit !== "hab." ? " " + r.unit : ""}`;
  for (const s of SPEC.sets) { const c = (st.sets || {})[s.key]; if (c?.values?.length) bits.push(c.values.map((v) => (s.options.find((o) => o[0] === v) || [v, v])[1]).join(", ")); }
  for (const r of SPEC.ranges) {
    const c = (st.ranges || {})[r.key]; if (!c || (c.min == null && c.max == null)) continue;
    bits.push(`${r.label} ${c.min != null ? "≥ " + fmt(r, c.min) : ""}${c.min != null && c.max != null ? " e " : ""}${c.max != null ? "≤ " + fmt(r, c.max) : ""}`);
  }
  for (const t of SPEC.toggles) if ((st.toggles || {})[t.key]) bits.push(t.label);
  if (st.cities?.length) bits.push(st.cities.join(", "));
  if (st.neighborhoods?.length) bits.push("bairros: " + st.neighborhoods.join(", "));
  return bits;
}

function renderStrategies() {
  const v = $("strategiesView");
  if (editing) { v.innerHTML = editorHTML(editing); wireEditor(); return; }
  const st = USER.alertState.strategies || {};

      <div class="st-crit">${strategySummary(s).map((b) => `<span class="tag">${esc(b)}</span>`).join("")}</div>
      <div class="st-crit">${s.enabled ? (s.email ? "Avisos por e-mail ligados" : "Avisos só no app") : "Avisos desligados"}</div>
      <div class="st-actions">
        <button class="btn btn-primary btn-sm" type="button" data-act="view" data-id="${s.id}">Ver imóveis</button>
        <button class="btn btn-sm" type="button" data-act="edit" data-id="${s.id}">Editar</button>
        <button class="btn btn-sm" type="button" data-act="dup" data-id="${s.id}">Duplicar</button>
      </div>
    </article>`;
  }).join("");
  v.innerHTML = `<div class="st-head"><h1>Minhas estratégias</h1><span class="spacer"></span>
      <button class="btn" type="button" id="stFromPreset">Usar modelo: até 50% do mercado</button>
      <button class="btn btn-primary" type="button" id="stNew">Nova estratégia</button></div>
    <p class="notice">Cada estratégia é um conjunto de critérios. Todo dia, depois da coleta, o AuctionTraker procura imóveis novos que atendem a cada uma e avisa você${store.mode === "live" ? ` por e-mail (${esc(USER.email || "")})` : ""} e aqui no app.</p>
    ${cards ? `<div class="st-list">${cards}</div>` : `<div class="empty"><strong>Nenhuma estratégia ainda.</strong><span>Comece pelo modelo “até 50% do mercado” e ajuste os critérios.</span></div>`}`;
  $("stNew").onclick = () => openEditor(blankStrategy(), true);
  $("stFromPreset").onclick = () => openEditor(presetStrategy(), true);
  v.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
    const s = USER.strategies.find((x) => x.id === b.dataset.id);
    if (b.dataset.act === "view") { activeStrategy = s; shown = PAGE; showTab("lots"); }
    if (b.dataset.act === "edit") openEditor(s);
    if (b.dataset.act === "dup") openEditor({ ...JSON.parse(JSON.stringify(s)), id: uid(), name: s.name + " (cópia)" }, true);

}

function openEditor(st, isNew = false) {
  editing = JSON.parse(JSON.stringify(st));
  editing._new = isNew;
  showTab("strategies");
}

function numVal(v) { return v === "" || v == null ? null : Number(v); }

function editorHTML(st) {
  const groups = SPEC.groups.map((g) => {
    const sets = SPEC.sets.filter((s) => s.group === g.key).map((s) => {
      const c = (st.sets || {})[s.key] || { values: [], unknown: false };
      return `<div class="field"><span class="label">${esc(s.label)}</span>
        <div class="chips">${s.options.map(([v, l]) => `<label class="chip-toggle"><input type="checkbox" data-set="${s.key}" value="${v}" ${c.values?.includes(v) ? "checked" : ""}><span>${esc(l)}</span></label>`).join("")}</div>
        <label class="check"><input type="checkbox" data-set-unknown="${s.key}" ${c.unknown ? "checked" : ""}> Incluir quando não informado</label>
        ${s.help ? `<span class="help">${esc(s.help)}</span>` : ""}</div>`;
    }).join("");
    const ranges = SPEC.ranges.filter((r) => r.group === g.key).map((r) => {
      const c = (st.ranges || {})[r.key] || {};
      const ref = r.key === "gdppc" ? ` Média nacional: ${brl.format(SPEC.reference.national_gdp_per_capita)}.` : "";
      return `<div class="range"><span class="label">${esc(r.label)}${r.unit ? ` <span class="unit">(${esc(r.unit)})</span>` : ""}</span>
        <div class="minmax">
          <input class="input" type="number" step="${r.step}" placeholder="mín." aria-label="${esc(r.label)} mínimo" data-range="${r.key}" data-bound="min" value="${c.min ?? ""}">
          <input class="input" type="number" step="${r.step}" placeholder="máx." aria-label="${esc(r.label)} máximo" data-range="${r.key}" data-bound="max" value="${c.max ?? ""}">
        </div>
        <label class="check"><input type="checkbox" data-range-unknown="${r.key}" ${c.unknown ? "checked" : ""}> Incluir quando não informado</label>
        ${r.help || ref ? `<span class="help">${esc((r.help || "") + ref)}</span>` : ""}</div>`;
    }).join("");
    const toggles = SPEC.toggles.filter((t) => t.group === g.key).map((t) =>
      `<div class="field"><label class="check"><input type="checkbox" data-toggle="${t.key}" ${(st.toggles || {})[t.key] ? "checked" : ""}> ${esc(t.label)}</label>${t.help ? `<span class="help">${esc(t.help)}</span>` : ""}</div>`).join("");
    let extra = "";
    if (g.key === "cidade") extra = `<div class="field"><span class="label">Como combinar os critérios da cidade</span>
        <div class="seg"><label><input type="radio" name="city_mode" value="all" ${st.city_mode !== "any" ? "checked" : ""}><span>Todos</span></label>
        <label><input type="radio" name="city_mode" value="any" ${st.city_mode === "any" ? "checked" : ""}><span>Pelo menos um</span></label></div>
        <span class="help">“Pelo menos um” aceita, por exemplo, uma capital OU uma cidade forte no agronegócio.</span></div>`;
    if (g.key === "local") extra = `<div class="field"><label for="ed-cities">Cidades-alvo (opcional)</label>
        <textarea class="input" rows="2" id="ed-cities" placeholder="Londrina/PR, Maringá/PR">${esc((st.cities || []).join(", "))}</textarea></div>
      <div class="field"><label for="ed-hoods">Bairros de boa liquidez (opcional)</label>
        <textarea class="input" rows="2" id="ed-hoods" placeholder="Centro, Gleba Palhano, Batel">${esc((st.neighborhoods || []).join(", "))}</textarea>
        <span class="help">O imóvel passa se o bairro ou o título contiver algum destes nomes.</span></div>`;
    if (g.key === "retorno") extra = `<div class="field" style="grid-column: 1 / -1"><span class="label">Premissas de custo (deixe em branco para usar o padrão)</span>
        <div class="ed-grid">${SPEC.roe_assumptions.map(([k, label, unit]) => `<div class="field"><label for="roe-${k}">${esc(label)}${unit ? ` <span class="unit">(${esc(unit)})</span>` : ""}</label>
          <input class="input" type="number" step="any" id="roe-${k}" data-roe="${k}" placeholder="${roeAssumptions()[k]}" value="${(st.roe_assumptions || {})[k] ?? ""}"></div>`).join("")}</div>
        <span class="help">Comprando à vista no leilão e revendendo. O ROE é calculado na faixa provável da avaliação, então muda imóvel a imóvel.</span></div>`;
    if (g.key === "edital") extra = `<div class="field"><label for="ed-debts">Dívidas de condomínio e IPTU</label>
        <select class="input" id="ed-debts">${SPEC.debts_options.map(([v, l]) => `<option value="${v}" ${st.debts === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
        <span class="help">Lido automaticamente do anúncio quando o site informa (Superbid, PGFN). Sempre confirme no edital — o checklist de cada imóvel ajuda nisso, inclusive na pesquisa de ações do ex-mutuário.</span></div>`;
    if (g.key === "leilao") extra = `<label class="check"><input type="checkbox" id="ed-hide-ended" ${st.hide_ended !== false ? "checked" : ""}> Ignorar leilões encerrados</label>`;

  return `<form class="editor" id="editor">
