# Runs the scrapers every day and uploads the results to Firestore.
#
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT  = the full contents of the service-account JSON key
# The key never lands in the repository; GitHub injects it into this job only.

name: Scrape auctions

on:
  schedule:
    - cron: "17 9 * * *"   # every day 09:17 UTC = 06:17 in São Paulo
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Offline tests
        run: python -m pytest -q

      - name: Write service-account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 scripts/write_credentials.py "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Scrape and upload to Firestore
        run: python -m auction_tracker scrape --firestore --project auctiontraker

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report
          path: data/latest_report.json
          retention-days: 30

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
