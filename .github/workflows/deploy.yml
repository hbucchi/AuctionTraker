# Publishes the website (web/) to Firebase Hosting and the Firestore security
# rules, using the same FIREBASE_SERVICE_ACCOUNT secret as the scraper.
# Runs when the site or rules change on main, or from the Actions tab.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "tests/rules/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The rules decide who can see whom (partners, groups): test them on the
      # Firestore emulator before anything is deployed.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Firestore security rules
        working-directory: tests/rules
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Write service-account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 scripts/write_credentials.py "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # The Maps browser key lives in the GOOGLE_MAPS_BROWSER_KEY secret, not in
      # the (public) repository. It is added to the published site only. It is
      # still visible to site visitors, as every Maps key is, so it must stay
      # restricted to the site's domains and the Maps JavaScript API.
      - name: Add the Google Maps browser key to the site
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            echo "No GOOGLE_MAPS_BROWSER_KEY secret: the site uses its schematic map."
          elif [[ "$MAPS_KEY" =~ ^[A-Za-z0-9_-]{20,64}$ ]]; then
            printf '\nwindow.GOOGLE_MAPS_KEY = "%s";\n' "$MAPS_KEY" >> web/firebase-config.js
            echo "Google Maps key added."
          else
            echo "::error::GOOGLE_MAPS_BROWSER_KEY doesn't look like an API key (letters, digits, - and _ only)"
            exit 1
          fi

      - name: Deploy hosting and Firestore rules
        run: npx --yes firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project auctiontraker --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
